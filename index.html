<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mae Ackerman - Enlaces</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999; 
            pointer-events: none;
            will-change: transform;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 105, 180, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 105, 180, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .pixel {
            position: absolute;
            border-radius: 12px; 
            animation: fall 6s linear infinite;
            top: -60px;
            opacity: 0.6;
            will-change: transform;
        }

        .pixel:nth-child(1) { width: 30px; height: 30px; background: #ffffff; box-shadow: 0 0 15px #ffffff; left: 10%; animation-delay: 0s; animation-duration: 5s; border-radius: 50%; }
        .pixel:nth-child(2) { width: 40px; height: 25px; background: #ff69b4; box-shadow: 0 0 15px #ff69b4; left: 25%; animation-delay: 1.5s; animation-duration: 6.5s; }
        .pixel:nth-child(3) { width: 25px; height: 40px; background: #ff1493; box-shadow: 0 0 15px #ff1493; left: 45%; animation-delay: 3s; animation-duration: 4.5s; border-radius: 50%;}
        .pixel:nth-child(4) { width: 45px; height: 45px; background: #ffffff; box-shadow: 0 0 15px #ffffff; left: 70%; animation-delay: 0.8s; animation-duration: 7s; }
        .pixel:nth-child(5) { width: 20px; height: 20px; background: #ffb6c1; box-shadow: 0 0 15px #ffb6c1; left: 85%; animation-delay: 4s; animation-duration: 5.5s; border-radius: 50%; }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(50vh) rotate(180deg) scale(1.2); }
            100% { transform: translateY(115vh) rotate(360deg) scale(1); }
        }

        .main-container {
            position: relative; 
            max-width: 440px; 
            width: 100%;
            z-index: 10;
            margin: auto; 
            display: flex;
            flex-direction: column;
        }

        /* --- PERSONAJE MAE --- */
        .mae-character {
            position: absolute;
            left: calc(100% - 40px);
            bottom: -10px; 
            height: 620px; 
            width: auto;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.4));
            animation: maeMicroFloat 6s ease-in-out infinite alternate; 
            z-index: -1; 
            will-change: transform;
            /* Prevención por si la imagen tarda en cargar */
            color: transparent;
            text-indent: -9999px;
        }

        @keyframes maeMicroFloat {
            0% { transform: translateY(3px) rotate(-0.5deg); }
            100% { transform: translateY(-3px) rotate(0.5deg); }
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            width: 100%;
            padding: 40px 28px;
            text-align: center;
            border: 3px solid rgba(255, 182, 193, 0.8);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            animation: softGlow 4s ease-in-out infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes softGlow {
            0% { box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4); border-color: rgba(255, 182, 193, 0.8); }
            100% { box-shadow: 0 10px 40px rgba(255, 105, 180, 0.6); border-color: rgba(255, 105, 180, 0.9); }
        }

        .profile-badge {
            display: inline-block;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ff1493;
            background: rgba(255, 105, 180, 0.15);
            padding: 8px 18px;
            border-radius: 25px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .profile-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff1493; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-shadow: 2px 2px 0px #ffe4e1, 0 0 15px rgba(255, 105, 180, 0.4);
            width: 100%;
        }

        .profile-description {
            font-size: 1.05rem;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 35px;
            text-align: center;
            background: rgba(255, 182, 193, 0.15);
            padding: 18px;
            border-radius: 16px;
            border: 2px dashed #ffb6c1;
            width: 100%;
            font-weight: 600;
        }

        .profile-description span {
            color: #ff1493;
            font-weight: 800;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .btn-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-radius: 20px; 
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: #ffffff;
            color: #ff69b4;
            border: 2px solid #ffb6c1;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform, box-shadow;
        }

        .btn-link span, .btn-link i {
            transition: transform 0.3s ease;
        }

        .btn-link:hover { transform: translateY(-4px) scale(1.02); }
        .btn-link:hover span { transform: translateX(6px); }
        .btn-link:active { transform: scale(0.96) translateY(0); }

        .tiktok:hover { background: #ff1493; color: #fff; border-color: #ff1493; box-shadow: 0 8px 20px rgba(255, 20, 147, 0.4); }
        .twitch:hover { background: #9146FF; color: #fff; border-color: #9146FF; box-shadow: 0 8px 20px rgba(145, 70, 255, 0.4); }
        .facebook:hover { background: #1877f2; color: #fff; border-color: #1877f2; box-shadow: 0 8px 20px rgba(24, 119, 242, 0.4); }
        .discord:hover { background: #5865F2; color: #fff; border-color: #5865F2; box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4); }

        .btn-link i { font-size: 1.35rem; }

        @media (max-width: 1200px) { .mae-character { height: 500px; left: calc(100% - 60px); } }
        @media (max-width: 992px) { .mae-character { height: 420px; left: calc(100% - 80px); } }

        @media (max-width: 768px) {
            body { padding: 20px 12px; }
            .profile-card { padding: 30px 20px; }
            .profile-title { font-size: 1.8rem; }
            .mae-character { 
                position: relative;
                left: auto;
                bottom: auto;
                height: 150px;
                width: auto;
                margin: 0 auto 15px auto;
                z-index: 5;
                order: -1;
                filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.4));
                animation: none; 
            }
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <div class="pixel-bg">
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
    </div>

    <div class="main-container">
        
        <!-- Aquí está la imagen actualizada -->
        <img src="imagen/mae.png" alt="" class="mae-character">

        <div class="profile-card">
            <span class="profile-badge">✿ VTuber & Streamer ✿</span>
            
            <h1 class="profile-title">MAE ACKERMAN</h1>
            
            <div class="profile-description">
                ¡Hola! Soy creadora de contenido y <span>VTuber</span>. Hago videos muy variados en TikTok y directos divertidos en Twitch. ¡Únete a mi comunidad y sígueme en todas mis redes! 💕
            </div>

            <div class="links-container">
                
                <a href="https://www.tiktok.com/@mae19_vt?_r=1&_t=ZS-9A5my9hRS7d" target="_blank" class="btn-link tiktok">
                    <span>TikTok</span>
                    <i class="fab fa-tiktok"></i>
                </a>

                <a href="https://www.twitch.tv/maeackerman19" target="_blank" class="btn-link twitch">
                    <span>Twitch</span>
                    <i class="fab fa-twitch"></i>
                </a>

                <a href="https://discord.gg/yh8HPxCjC" target="_blank" class="btn-link discord">
                    <span>Discord</span>
                    <i class="fab fa-discord"></i>
                </a>

                <a href="https://www.facebook.com/share/1HqPMHjxce/" target="_blank" class="btn-link facebook">
                    <span>Facebook</span>
                    <i class="fab fa-facebook-f"></i>
                </a>

            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const colors = ['#ffb6c1', '#ff69b4', '#ffffff', '#ff1493']; 
        
        let lastTime = performance.now();

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
        });
        resizeCanvas();

        window.addEventListener('mousemove', function(e) {
            if (particles.length < 150) { 
                for(let i = 0; i < 2; i++) {
                    particles.push({
                        type: 'trail',
                        x: e.clientX,
                        y: e.clientY,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        size: Math.random() * 2 + 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1
                    });
                }
            }
        });

        window.addEventListener('click', function(e) {
            const starCount = 25; 
            for(let i = 0; i < starCount; i++) {
                let angle = (Math.PI * 2 / starCount) * i + (Math.random() - 0.3);
                let speed = Math.random() * 4 + 2;

                particles.push({
                    type: 'star',
                    x: e.clientX,
                    y: e.clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    gravity: 0.08,
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.15
                });
            }
        });

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function animate(currentTime) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let dt = (currentTime - lastTime) / 16.666; 
            if (dt > 2) dt = 2; 
            lastTime = currentTime;

            let trailParticles = particles.filter(p => p.type === 'trail');
            if (trailParticles.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trailParticles[0].x, trailParticles[0].y);
                for (let i = 1; i < trailParticles.length; i++) {
                    ctx.lineTo(trailParticles[i].x, trailParticles[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 105, 180, 0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            particles = particles.filter(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                
                if (p.type === 'star') {
                    p.vy += p.gravity * dt;
                    p.rotation += p.rotSpeed * dt;
                    p.alpha -= 0.015 * dt;
                } else {
                    p.alpha -= 0.030 * dt;
                }

                if (p.alpha <= 0) return false;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 8; 
                ctx.shadowColor = p.color;

                if (p.type === 'star') {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    drawStar(ctx, 0, 0, 5, p.size, p.size / 2, p.color);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }
                ctx.restore();
                return true;
            });

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>

</body>
</html>
